# Declarative Cloud Run service definition — the cost, latency and isolation
# posture as code.
#
#   gcloud run services replace apps/inferrence/deploy/cloudrun.service.yaml --region=us-central1
#
# ## Why gen1
#
# gen1 starts faster and has a smaller per-instance footprint than gen2, which is
# what the control plane wants. The trade is that **Cloud Run sandboxes require
# gen2**, so untrusted execution is not hosted here: `SANDBOX_PROVIDER=remote`
# sends it to the gen2 `sandbox-runner` over HTTP. One hop, in exchange for
# gen1's cold start on everything else.
#
# ## Why the numbers are what they are
#
#   - minScale 0 + cpu-throttling: zero idle cost. Warm instances are only worth
#     paying for briefly during a rollout.
#   - containerConcurrency is a **sandbox-admission bound**, not just a throughput
#     knob: each concurrent run can hold a sandbox on the runner.
#   - timeoutSeconds 900: an agent turn is long. Note that an open SSE stream is
#     billed as active CPU for its whole duration, so run duration is a cost
#     control — the service closes the stream on `run.completed` by default.
#   - maxScale is capped so a runaway client cannot scale out unbounded.
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: inferrence
  labels:
    app: inferrence
    part-of: agentic-ems
  annotations:
    run.googleapis.com/launch-stage: GA
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "10"
        run.googleapis.com/execution-environment: gen1
        run.googleapis.com/cpu-throttling: "true"
        run.googleapis.com/startup-cpu-boost: "true"
    spec:
      containerConcurrency: 8
      timeoutSeconds: 900
      serviceAccountName: inferrence-run@PROJECT.iam.gserviceaccount.com
      containers:
        - name: inferrence
          image: us-central1-docker.pkg.dev/PROJECT/inferrence/inferrence:latest
          ports:
            - name: http1
              containerPort: 8080
          resources:
            limits:
              cpu: "2"
              memory: 2Gi
          env:
            # --- service posture -------------------------------------------------
            # `dry` = never broadcasts. `live` additionally refuses to boot behind a
            # spoofable authenticator, so it stays off until Privy auth lands.
            - name: INFERENCE_MODE
              value: dry
            # In-memory state is single-instance-safe only; maxScale is capped
            # accordingly. TimescaleDB stores are ROADMAP T1.1/T1.3.
            - name: INFERENCE_PERSISTENCE
              value: memory
            - name: AGENT_IMPL
              value: mock
            - name: INFERENCE_MAX_CONCURRENT_RUNS
              value: "4"
            - name: INFERENCE_SSE_HEARTBEAT_MS
              value: "15000"
            - name: LOG_LEVEL
              value: info
            # --- sandbox (gen2 service) -----------------------------------------
            - name: SANDBOX_PROVIDER
              value: remote
            - name: SANDBOX_SERVICE_URL
              value: https://sandbox-runner-PROJECT.us-central1.run.app
            - name: SANDBOX_MAX_PER_INSTANCE
              value: "4"
            - name: SANDBOX_EGRESS_ALLOWLIST
              value: gateway.thegraph.com,yields.llama.fi,api.llama.fi
            # --- models ----------------------------------------------------------
            - name: GOOGLE_CLOUD_LOCATION
              value: us-central1
            - name: TIMESFM3_SERVICE_URL
              value: https://timesfm3-inference-887606357212.us-central1.run.app
            # --- custody ---------------------------------------------------------
            # `privy` signs with a Privy server wallet: the P-256 authorization key
            # and the app secret live in Secret Manager, never in this file. The
            # wallet's address must be a Safe owner at threshold 1, or the proposal
            # can never be signed — `privy:resolve` reports both.
            - name: CUSTODY_SIGNER
              value: privy
            - name: CUSTODY_SAFE_CHAIN
              value: sepolia
            - name: CUSTODY_SAFE_OWNERS
              value: "0x4E739DA1405CBF48f98084975786C835DB73E63A"
            - name: CUSTODY_SAFE_THRESHOLD
              value: "1"
            - name: PRIVY_APP_ID
              value: cmtx97qgx008q0ck04fad145i
            - name: PRIVY_WALLET_ID
              value: tqlslk0mvxvfvwgcunk43ba0
            - name: PRIVY_WALLET_ADDRESS
              value: "0x4E739DA1405CBF48f98084975786C835DB73E63A"
            # --- tracing ---------------------------------------------------------
            - name: LANGSMITH_TRACING
              value: "true"
            - name: LANGSMITH_PROJECT
              value: agentic-ems-inferrence
            # EU accounts MUST set the EU host — the default US endpoint 403s.
            - name: LANGSMITH_ENDPOINT
              value: https://eu.api.smith.langchain.com
            - name: LANGSMITH_WORKSPACE_ID
              value: b3e0597d-3571-4d2d-be46-148b69aa9176
            # Secrets are referenced individually rather than through `envFrom`,
            # so it is obvious from this file which credential maps to which var.
            - name: PRIVY_APP_SECRET
              valueFrom:
                secretKeyRef:
                  name: inferrence-privy-app-secret
                  key: latest
            - name: PRIVY_AUTHORIZATION_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: inferrence-privy-auth-key
                  key: latest
            - name: LANGSMITH_API_KEY
              valueFrom:
                secretKeyRef:
                  name: inferrence-langsmith-key
                  key: latest
          envFrom:
            - secretRef:
                name: inferrence-secrets
          startupProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 3
            failureThreshold: 20
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 30
