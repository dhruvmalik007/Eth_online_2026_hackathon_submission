# This folder is its own pnpm workspace root, so `pnpm install` here installs
# the app's own dependencies even when the folder lives inside another workspace.
packages:
  - "../../packages/ux-workflow"
  - "../../packages/env"
  - "../../packages/positions"
  - "../../packages/the-graph"

allowBuilds:
  sharp: true

minimumReleaseAgeExclude:
  - "@reactor-models/fast-h3@1.0.2"
