# Vendored Foundry dependencies.
#
# `contracts/lib/` is gitignored, so this file is the record of what belongs in
# it. Run `./install-libs.sh` to populate or restore it.
#
# ## Why these come from source rather than npm
#
# `@1inch/swap-vm` and `@1inch/aqua` both carry npm badges and install
# instructions in their READMEs, but the registry 404s on both:
#
#   $ npm view @1inch/swap-vm version
#   npm error 404 Not Found - GET https://registry.npmjs.org/@1inch%2fswap-vm
#   $ npm view @1inch/aqua version
#   npm error 404 Not Found - GET https://registry.npmjs.org/@1inch%2faqua
#
# So the Solidity has to be fetched from source. (The *TypeScript* SDKs do exist
# and are used by the client layer: `@1inch/aqua-sdk`, `@1inch/swap-vm-sdk`.)
#
# ## Why the versions are these versions
#
# They are the ones 1inch/swap-vm pins in its own package.json, so the tree we
# compile is the tree upstream compiles:
#
#   "@1inch/aqua": "github:1inch/aqua#v1.0.0"
#   "@1inch/solidity-utils": "6.9.10"
#   "@openzeppelin/contracts": "5.4.0"
#   "forge-std": "github:foundry-rs/forge-std#v1.11.0"
#
# ## Gotchas worth recording
#
# - 1inch/solidity-utils tags have **no `v` prefix** (`6.9.10`, not `v6.9.10`).
#   The prefixed URL silently yields an empty directory rather than an error.
# - `@1inch/aqua` is imported as `@1inch/aqua/src/interfaces/IAqua.sol`, so its
#   remapping points at the repository root, not at `src/`.

