# Vendored Foundry dependencies for the Uniswap package.
#
# `contracts/lib/` is gitignored, so this file is the record of what belongs in it.
# Run `./install-libs.sh` to populate or restore it.
#
# ## Why only forge-std
#
# Every other package here needs the Aqua/SwapVM toolchain; this one does not. Its
# tests hand-write the v4 structs and interfaces they call, so the v4 periphery is
# not a build dependency — which is deliberate: a test that cannot run until the
# 1inch toolchain is installed is a test nobody runs.
#
# Since the ABI is hand-written rather than imported, it is pinned as data instead:
# `abi/PositionManager.optimism.json` is the verified deployed ABI, committed so the
# encoding can be checked against the chain rather than against a docs page.
#
# ## Licence
#
# forge-std is MIT OR Apache-2.0 and lives in a gitignored directory, so its licence
# texts are copied to the repository's `licenses/` directory — see
# THIRD_PARTY_NOTICES.md. A licence that only exists inside an ignored directory is
# not distributed.

